services:
  api:
    build:
      context: ./api
    networks:
      - ml-network

  model-server:
    build:
      context: ./model-server
    networks:
      - ml-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - ml-network

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_DB=mydatabase
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
    ports:
      - "5432:5432"
    networks:
      - ml-network

networks:
  ml-network:
    driver: bridge
