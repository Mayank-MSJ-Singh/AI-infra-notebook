apiVersion: apps/v1
kind: Deployment
metadata:
    name: ml-api
    labels:
        app: ml-api
spec:
    replicas: 3
    selector:
        matchLabels:
            app: ml-api
    template:
        metadata:
            labels:
                app: ml-api
        spec:
            containers:
            - name: ml-api
              image: ml-api:v1
              imagePullPolicy: Never
              ports:
              - containerPort: 8080
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
